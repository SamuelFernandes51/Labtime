<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Criar Conta</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Fonte moderna para o tema -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="stylecad.css">
    <link rel="shortcut icon" href="imgs/lab2.jpeg" type="image/x-icon">

</head>
<body>

<div class="auth-card">
    <h1>Criar Conta</h1>

    <!-- Removi as tags <br><br> e usei CSS/divs para espaçamento -->
    <input id="nome" type="text" placeholder="Nome" autocomplete="off" required>
    <input id="email" type="email" placeholder="Email" autocomplete="off" required>
    <input id="senha" type="password" placeholder="Senha" autocomplete="off" required>

    <button onclick="cadastrar()" class="btn-primary">Cadastrar</button>

    <div class="nav-links">
        <!-- Mantido o HTML original para os links -->
        <p>Já tem conta? <a href="login.html">Entrar</a></p>
        <a href="index.html">Voltar a página inicial</a>
    </div>
</div>

<!-- O script externo é mantido no local original -->
<script src="js/auth.js"></script>

</body>
</html>

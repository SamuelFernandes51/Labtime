<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Home do Professor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="profhome.css">
    <link rel="shortcut icon" href="imgs/lab2.jpeg" type="image/x-icon">

</head>
<body>

<div class="card">
    <!-- O span com o id="nome" é onde o nome do professor será inserido -->
    <h2>Bem-vindo, <span id="nome">Professor</span> 👋</h2>

    <button onclick="window.location.href='agendamento.html'">Agendar Aula</button>
    <button onclick="window.location.href='agendamentos.html'">Ver Agendamentos</button>
    <button id="logout" onclick="logout()">Sair</button>
</div>

<script>
    // Função de Logout
    function logout() {
        // Remove as chaves do localStorage para garantir limpeza completa
        localStorage.removeItem("token");
        localStorage.removeItem("nome");

        // Substituído alert() por console.log e redirecionamento, conforme as diretrizes
        console.log("Logout realizado!");
        // Uso explícito de window.location.href para redirecionar
        window.location.href = "login.html";
    }

    // --- Lógica de Verificação e Exibição do Nome ---
    
    // 1. Verificar se o usuário está logado
    const token = localStorage.getItem("token");
    let nome = localStorage.getItem("nome");

    if (!token) {
        // Se não houver token, redireciona
        console.error("Você precisa fazer login primeiro!");
        // Uso explícito de window.location.href para redirecionar
        window.location.href = "login.html";
    }

    // 2. Tratar o nome para evitar "undefined"
    // Verifica se o valor é nulo, vazio ou a string literal "undefined"
    if (!nome || nome.trim() === "" || nome === "undefined") {
        nome = "Professor"; // Valor padrão seguro
    }

    // 3. Mostrar nome do professor logado
    const nomeElement = document.getElementById("nome");
    if (nomeElement) {
        nomeElement.innerText = nome;
    }
    
    // EXCLUÍDO: O código original tinha um alert() aqui que foi removido
</script>

</body>
</html>

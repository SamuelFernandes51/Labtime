<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Agendamentos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="agendamentos.css">
    <!-- Ajustando o link do ícone: Você deve preencher o caminho correto da imagem -->
    <link rel="shortcut icon" href="imgs/labtime.jpg" type="image/x-icon"> 
    
</head>
<body>

<h1>Agendamentos de Todos os Professores</h1>

<!-- Removendo atributos de estilo HTML (border, cellpadding) para usar o CSS moderno -->
<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Professor</th>
                <th>Laboratório</th>
                <th>Data</th>
                <th>Aula</th>
                <th>Ações</th> <!-- Cabeçalho visual para o botão -->
            </tr>
        </thead>

        <tbody id="lista">
            <!-- 
                As linhas da tabela serão preenchidas aqui pelo seu script 'js/agendamento.js'.
                Lembre-se: O script DEVE adicionar o atributo data-label a cada <td> para a responsividade funcionar.
                Exemplo: <td data-label="Professor">Nome do Professor</td>
            -->
        </tbody>
    </table>
</div>

<!-- Usando a classe de estilo "btn-voltar" que definimos no CSS -->
<a href="professor_home.html" class="btn-voltar">Voltar para Home</a>

<script src="js/agendamento.js"></script>

</body>
</html>
